forbidden:
  - pattern: "(?i)pop is not lock-free because"
    why: "FilterQueue's locked-pop rationale is inference; phrase it as the author's reading"
  - pattern: "(?i)design discussion"
    near: "PostBox"
    why: "JFR's PostBox has no public design record; label the section as a reading of the code"
  - pattern: "(?i)\\bcrash"
    near: "8348960"
    why: "the Leyden test hung (stuck, compilers idle); no crash"
  - pattern: "(?i)\\bcrash"
    near: "8266557"
    why: "8266557 was an assertion failure in testing; no field crash on record"
  - pattern: "(?i)every (10th|tenth)"
    why: "the counter serves the low-priority list first on every 11th pick (counter 0..9 high first, reset at 10)"
  - pattern: "(?i)(in response|in answer|as she asked|as (Phillimore|she) requested)"
    near: "Installing VM operation"
    why: "whether the trace timer was added for Phillimore's request is not on record; state only that the shipped commit has it"
  - pattern: "(?i)(ranked|ranking|rank) because"
    near: "2011"
    why: "the 2011 review of the ranked compile queue is just 'Good.'; the only rationale is the header comment"
  - pattern: "(?i)leyden.{0,60}(shipped|mainline (has|uses))"
    why: "the lock-free compile queue exists only in the Leyden prototype branch, never in mainline"
