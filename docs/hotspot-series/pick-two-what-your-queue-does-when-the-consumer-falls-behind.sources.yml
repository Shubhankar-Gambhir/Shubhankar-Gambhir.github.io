quotes:
  # 2019: the problem
  - id: rama-pauses
    text: "some folks noticed much longer than expected pauses that seemed to coincide with GC logging in the midst of a GC safepoint"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2019-August/039130.html
  - id: rama-tmpfs
    text: "rather than to a RAM-based tmpfs which had been the original design center assumption"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2019-August/039130.html
  - id: rama-others
    text: "A buffered logging scheme was then implemented by us (and independently by others)"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2019-August/039130.html

  # 2020: grow, then drop the oldest
  - id: liu-8u-sync
    text: "p99 increases from 0.486s to 0.567s, which is 16,7% longer"
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-February/038211.html
  - id: liu-8u-loss
    text: "delay5ms-async remains the same p99 and p100 at expense of losing 148k logging events"
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-February/038211.html
  - id: liu-grow
    text: "In this implementation, I decide to use dynamic memory. ie. It doesn't drop any message. It's because I observe that asynchronous task is so fast that it doesn't need much memory to buffer all messages in the interval."
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-February/038211.html
  - id: liu-fifo
    text: "A mutex-protected FIFO stores all asynchronous log messages."
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-February/038211.html
  - id: liu-implode
    text: "If writing to filesystem stalls infinitely, JVM may implode because of memory usage."
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-March/038495.html
  - id: liu-gave-up-ring
    text: "Indeed, I gave up ringbuffer design in previous version and turn to use a dynamic allocated linkedlist. If writing to filesystem stalls infinitely, JVM may implode because of memory usage."
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-March/038495.html
  - id: liu-drop-early
    text: "It will start dropping early messages of the FIFO if it has consumed too many free memories."
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2020-March/038495.html

  # March-April 2021: the public review
  - id: stuefe-unavoidable
    text: "if we work with a limited flush buffer and we log too much, things will get dropped, that is unavoidable. But it has to be reliable and comprehensible after the fact."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050373.html
  - id: stuefe-in-band
    text: "a log system which randomly omits log entries because some internal buffer is full without giving any indication in the log itself is a terrible idea :)"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050373.html
  - id: holmes-bounded
    text: "I'm not sure it should be a bounded size at all."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050386.html
  - id: holmes-unbounded
    text: "Why can't the design accommodate unlimited buffer space as determined by available memory?"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050386.html
  - id: liu-pick-two
    text: "It can be proven that we cannot have all three guarantees at the same time: non-blocking, bounded memory and log fidelity."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050459.html
  - id: liu-trade
    text: "we think it's fair to trade log fidelity for non-blocking"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050459.html
  - id: ehn-two-arrays
    text: "If you instead use two arrays, one active and one for flushing, you can swap them with atomic stores from the flushing thread."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-March/050479.html
  - id: liu-all-writers
    text: "Unfortunately, all participants of logging are writers. No one is read-only."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-April/050620.html
  - id: liu-grumpy
    text: "TBH, I would rather grumpy customers yell at me about async-logging performance first before jump into lock-free algorithms."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-April/050620.html
  - id: liu-reviewed
    text: "it's easy to implement using a lock. it is easy to be reviewed as well."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-April/050620.html
  - id: ehn-readers
    text: "From the algorithm perspective all loggers are readers. We are protecting the buffer pointer which only the flusher writes to."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-April/050663.html
  - id: ehn-battle-proven
    text: "If you feel that your current code is battle-proven and you think doing additional enhancements as incremental changes is better, please do so."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2021-April/050663.html

  # May 2021: the CSR, drop the newest
  - id: liu-ringbuffer
    text: "current policy simulates a RingBuffer"
    url: https://bugs.openjdk.org/browse/JDK-8264323
  - id: holmes-user-choice
    text: "it may be that the user needs to be able to decide which is better for them?"
    url: https://bugs.openjdk.org/browse/JDK-8264323
  - id: liu-recent
    text: "I think recent logging messages are more relevant when AsyncLog flusher thread get blocked."
    url: https://bugs.openjdk.org/browse/JDK-8264323
  - id: holmes-old-clue
    text: "The cons of dropping oldest is that it is the old log messages that may give you the clue as to why the log buffer filled up faster than it could be drained."
    url: https://bugs.openjdk.org/browse/JDK-8264323
  - id: stuefe-gaps
    text: "gaps in the log related to the time the buffer was exhausted"
    url: https://bugs.openjdk.org/browse/JDK-8264323
  - id: stuefe-not-user
    text: "I would not leave this up to the user to choose."
    url: https://bugs.openjdk.org/browse/JDK-8264323
  - id: liu-easier
    text: "Indeed, no matter what kind of data struture, dropping incoming message is easier:)"
    url: https://bugs.openjdk.org/browse/JDK-8264323

  # June-July 2021: the full path breaks
  - id: leak-8269064
    text: "when we decide to drop the message, we need to call os::free for the string, or memory leaks."
    url: https://bugs.openjdk.org/browse/JDK-8269064
  - id: aix-32k
    text: "SEM_VALUE_MAX limit of 32k"
    url: https://bugs.openjdk.org/browse/JDK-8269865
  - id: holmes-n-signals
    text: "If you have N loggers you get N signals and N messages. The writer thread will write all N messages at once and then loop another N-1 times (redundantly calling write()) before blocking."
    url: https://bugs.openjdk.org/browse/JDK-8269865
  - id: holmes-cant-keep-up
    text: "The problem _is_ that the async log thread can't keep up"
    url: https://bugs.openjdk.org/browse/JDK-8269865
  - id: holmes-monitor-fix
    text: "replace two uses of Semaphore with one PlatformMonitor and so completely avoid any overflow issues"
    url: https://bugs.openjdk.org/browse/JDK-8269865
  - id: holmes-serialization
    text: "with so much activity it will be a serialization point"
    url: https://bugs.openjdk.org/browse/JDK-8269865
  - id: holmes-lockfree
    text: "We may need to look at a lock-free technique for that (not as part of this bug fix)."
    url: https://bugs.openjdk.org/browse/JDK-8269865

  # 2022: ping-pong buffers, mutex kept
  - id: pingpong-glibc
    text: "This implementation has impact on glibc/malloc."
    url: https://mail.openjdk.org/pipermail/hotspot-runtime-dev/2022-August/057285.html
  - id: pingpong-mutex
