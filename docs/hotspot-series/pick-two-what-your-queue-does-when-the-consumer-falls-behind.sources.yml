  # 2024: starvation, a ring, stall, policy as a choice
  - id: sjolen-starve
    text: "This can lead the output thread to suffer from starvation, as it cannot take the mutex to swap the buffers. This in turn leads to excessive dropping of messages"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-February/084892.html
  - id: sjolen-two-mutexes
    text: "a basic producer/consumer pattern with two mutexes and a circular buffer"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-February/084892.html
  - id: stuefe-never-liked
    text: "I never liked the idea of losing output"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-February/084893.html
  - id: liu-why-async
    text: "why do we still choose async-logging in the first place?"
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-March/085961.html
  - id: liu-20-runs
    text: "I ran 20 iterations and compare their differences using T-test."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-March/085961.html
  - id: liu-86
    text: "For stdout, the mean of dropped message reduces 2.9%. For file, the mean of dropped message reduces 86.8%."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-March/085961.html
  - id: holmes-policy-choice
    text: "when the producers do outstrip the consumer then you have to decide what is more important: the log message, or the non-blocking behaviour? That is a policy choice the programmer should be allowed to make."
    url: https://mail.openjdk.org/pipermail/hotspot-dev/2024-March/085964.html
  - id: holmes-tpe-caller
