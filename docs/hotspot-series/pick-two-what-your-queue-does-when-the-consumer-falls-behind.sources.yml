forbidden:
  - pattern: "(?i)three times"
    near: "lock-free"
    why: "lock-free was not proposed three times: one sketch declined by the patch author, a fixed array adopted under a mutex, a circular buffer (with mutexes) withdrawn by its author"
  - pattern: "(?i)changed four times in review"
    why: "four answers between 2020 and 2025, not four changes in one review"
  - pattern: "(?i)five weeks after (it )?ship"
    why: "JDK-8269865 was filed five weeks after integration, not after shipping"
  - pattern: "(?i)async:off"
    why: "the explicit off mode is jdk-28+18, after the jdk-27-ga pin; out of scope"
  - pattern: "(?i)lock-free (ring|circular)"
    why: "Sjolen's circular buffer used two mutexes; the 86.8% is not a lock-free result"
  - pattern: "(?i)\\bcrash"
    near: "8269865"
    why: "the semaphore overflow was a debug-build assertion in a gtest run, not a field crash"
  - pattern: "(?i)\\bcrash"
    near: "8244289"
    why: "the JFR lock leak surfaced as a debug-build assertion; no field crash on record"
  - pattern: "(?i)before the (consumer|writer|output|logging) thread (was |had )?(been )?start"
    why: "the 8362282 mechanism (a producer stalling before the writer started) is an inference, not stated in the bug"
  - pattern: "(?i)(went|go|gone|became) stale"
    near: "8368071"
    why: "no mechanism for the compile-queue regression is on record; stale-request explanation is inference"
  - pattern: "(?i)JFR (drops|discards|chose|picked) the oldest because"
    why: "JFR's drop-oldest rationale is one JEP sentence; do not attribute a reason beyond it"
