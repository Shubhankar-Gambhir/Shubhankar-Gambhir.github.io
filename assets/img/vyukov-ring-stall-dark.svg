<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-label="An eight-cell ring. The dequeue ticket is 10 and points at cell 2, which a stalled producer claimed but never wrote. Cells 3 to 5 are full, but the consumer at ticket 10 sees an unwritten cell and returns empty.">
