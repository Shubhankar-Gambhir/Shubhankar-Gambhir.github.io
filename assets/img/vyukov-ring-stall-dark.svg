<text x="360.0" y="206" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#efefef">pop() at ticket 10 reads seq 10, not 11, and returns EMPTY,</text>
<text x="360.0" y="224" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#efefef">so every consumer waits at cell 2 while cells 3 to 5 sit full.</text>
