<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="A triangle whose corners are non-blocking, bounded memory and log fidelity. The edge between non-blocking and bounded memory holds the drop policies, the edge between non-blocking and fidelity holds grow, and the edge between bounded memory and fidelity holds block. HotSpot moved from grow in February 2020 to drop oldest in March 2020, drop newest in May 2021, and added stall as an option in February 2025.">
<rect width="720" height="460" fill="#1b1b1e"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#338ced"/></marker>
</defs>
<polygon points="360,64 210,312 510,312" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linejoin="round"/>
<text x="360.0" y="48.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#efefef" font-weight="600">non-blocking</text>
<text x="200.0" y="338.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="end" fill="#efefef" font-weight="600">bounded memory</text>
<text x="520.0" y="338.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="start" fill="#efefef" font-weight="600">log fidelity</text>
<circle cx="360" cy="64" r="5" fill="#efefef"/>
<circle cx="210" cy="312" r="5" fill="#efefef"/>
<circle cx="510" cy="312" r="5" fill="#efefef"/>
<text x="22.0" y="150.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" text-anchor="start" fill="#efefef" font-weight="600">Drop: lose messages</text>
<text x="22.0" y="168.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#9c9c9c">drop oldest, drop newest, abort</text>
<text x="22.0" y="186.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="start" fill="#9c9c9c">-Xlog:async (default)</text>
<text x="22.0" y="204.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="start" fill="#9c9c9c">spdlog overrun_oldest, discard_new</text>
<text x="22.0" y="222.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="start" fill="#9c9c9c">moodycamel try_enqueue</text>
<text x="22.0" y="240.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="start" fill="#9c9c9c">boost bounded_push</text>
<text x="698.0" y="150.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" text-anchor="end" fill="#efefef" font-weight="600">Grow: lose the bound</text>
<text x="698.0" y="168.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#9c9c9c">std::queue behind a mutex</text>
<text x="698.0" y="186.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#9c9c9c">moodycamel enqueue</text>
<text x="698.0" y="204.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="end" fill="#9c9c9c">boost push</text>
<text x="360.0" y="360.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#efefef" font-weight="600">Wait: lose non-blocking</text>
<text x="360.0" y="378.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#9c9c9c">block, caller runs</text>
<text x="360.0" y="396.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" text-anchor="middle" fill="#9c9c9c">-Xlog:async:stall, spdlog block (default), folly blockingWrite</text>
<line x1="429.1" y1="196.3" x2="318.3" y2="162.9" stroke="#338ced" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="295.8" y1="170.2" x2="260.3" y2="228.9" stroke="#338ced" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="263.8" y1="250.1" x2="346.5" y2="303.3" stroke="#338ced" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="442.5" cy="200.4" r="11" fill="#338ced" stroke="#1b1b1e" stroke-width="2"/>
<text x="442.5" y="204.9" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1e" font-weight="700">1</text>
<circle cx="303.0" cy="158.2" r="11" fill="#338ced" stroke="#1b1b1e" stroke-width="2"/>
<text x="303.0" y="162.7" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1e" font-weight="700">2</text>
<circle cx="252.0" cy="242.6" r="11" fill="#338ced" stroke="#1b1b1e" stroke-width="2"/>
<text x="252.0" y="247.1" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1e" font-weight="700">3</text>
<circle cx="360.0" cy="312.0" r="11" fill="#338ced" stroke="#1b1b1e" stroke-width="2"/>
<text x="360.0" y="316.5" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1b1b1e" font-weight="700">4</text>
<text x="360.0" y="438.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#efefef">HotSpot: 1 grow, Feb 2020 · 2 drop oldest, Mar 2020 · 3 drop newest, May 2021 · 4 stall as an option, Feb 2025</text>
</svg>
