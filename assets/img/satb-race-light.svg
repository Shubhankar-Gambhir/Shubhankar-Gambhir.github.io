<line x1="304.8" y1="86.6" x2="280.6" y2="130.7" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
<line x1="235.2" y1="86.6" x2="259.4" y2="130.7" stroke="#257de0" stroke-width="2" marker-end="url(#ah-accent)"/>
<circle cx="226" cy="70" r="19" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="226.0" y="75.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">A</text>
<circle cx="314" cy="70" r="19" fill="#b9b9b9" stroke="#b9b9b9" stroke-width="1.5"/>
<text x="314.0" y="75.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#191919" font-weight="700">B</text>
<circle cx="270" cy="150" r="19" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="270.0" y="155.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#191919" font-weight="700">C</text>
<text x="270.0" y="206.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919">2. Java thread:</text>
<text x="270.0" y="222.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" text-anchor="middle" fill="#191919">A.field = B.field</text>
