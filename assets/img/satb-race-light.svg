<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" width="720" height="276" role="img" aria-label="Four frames. The marker has scanned A; B is found but not scanned and points to C. A Java thread copies B.field into A.field, then nulls B.field. The marker scans B and finds nothing, so C is never marked although A still points to it.">
<rect width="720" height="276" fill="#ffffff"/>
<defs>
<marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#257de0"/></marker>
<marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f47230"/></marker>
</defs>
<line x1="124.8" y1="86.6" x2="100.6" y2="130.7" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
