<circle cx="450" cy="150" r="19" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="450.0" y="155.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#191919" font-weight="700">C</text>
<text x="450.0" y="206.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919">3. Java thread:</text>
<text x="450.0" y="222.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" text-anchor="middle" fill="#191919">B.field = null</text>
