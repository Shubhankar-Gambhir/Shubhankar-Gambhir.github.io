<text x="163.0" y="254.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="start" fill="#191919">scanned</text>
<circle cx="229" cy="250" r="7" fill="#b9b9b9" stroke="#b9b9b9" stroke-width="1.5"/>
<text x="242.0" y="254.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="start" fill="#191919">found, not yet scanned</text>
<circle cx="413" cy="250" r="7" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="426.0" y="254.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="start" fill="#191919">not found</text>
