<circle cx="90" cy="150" r="19" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="90.0" y="155.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#191919" font-weight="700">C</text>
<text x="90.0" y="206.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919">1. Marker has</text>
<text x="90.0" y="222.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919">scanned A</text>
