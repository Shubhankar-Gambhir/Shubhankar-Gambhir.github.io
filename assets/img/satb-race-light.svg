<line x1="595.2" y1="86.6" x2="619.4" y2="130.7" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
<circle cx="586" cy="70" r="19" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1.5"/>
<text x="586.0" y="75.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">A</text>
