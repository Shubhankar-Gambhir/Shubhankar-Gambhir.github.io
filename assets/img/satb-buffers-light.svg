<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Each Java thread writes old pointer values into its own buffer with no atomics, filling it downward. When the buffer is full the thread filters it and keeps writing if 60 percent or fewer entries survive; otherwise it pushes the buffer onto the shared list with a compare-and-swap and takes a fresh one from the buffer allocator. GC marking threads pop buffers from the list, process them and return them to the allocator. Partially filled buffers are collected from every thread in the stop-the-world pause at the end of marking.">
<rect width="720" height="360" fill="#ffffff"/>
<defs>
<marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#257de0"/></marker>
</defs>
<rect x="20" y="40" width="190" height="48" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32.0" y="60.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="start" fill="#191919" font-weight="600">Java thread 1</text>
<text x="32.0" y="77.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#666666">SATB buffer</text>
<rect x="118" y="66" width="80" height="12" fill="none" stroke="#8a8a8a"/>
<rect x="170.0" y="66" width="28.0" height="12" fill="#257de0" opacity="0.55"/>
<rect x="20" y="104" width="190" height="48" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32.0" y="124.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="start" fill="#191919" font-weight="600">Java thread 2</text>
<text x="32.0" y="141.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#666666">SATB buffer</text>
<rect x="118" y="130" width="80" height="12" fill="none" stroke="#8a8a8a"/>
<rect x="142.0" y="130" width="56.0" height="12" fill="#257de0" opacity="0.55"/>
<rect x="20" y="168" width="190" height="48" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="32.0" y="188.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="start" fill="#191919" font-weight="600">Java thread 3</text>
<text x="32.0" y="205.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#666666">SATB buffer</text>
<rect x="118" y="194" width="80" height="12" fill="none" stroke="#8a8a8a"/>
<rect x="118.0" y="194" width="80.0" height="12" fill="#257de0" opacity="0.55"/>
<text x="115.0" y="30.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">writes: no atomics, no fence</text>
<path d="M120,216 C120,250 60,250 60,220" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
<text x="20.0" y="268.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#666666">full: filter it; if 60% or</text>
<text x="20.0" y="283.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#666666">fewer survive, keep writing</text>
<rect x="290" y="120" width="150" height="84" rx="6" fill="#e3effc" stroke="#257de0" stroke-width="1.5"/>
<text x="365.0" y="144.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919" font-weight="600">shared list</text>
<text x="365.0" y="161.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">of full buffers</text>
<text x="365.0" y="178.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">(lock-free stack)</text>
<path d="M210,192 C250,192 250,170 286,170" fill="none" stroke="#257de0" stroke-width="1.5" marker-end="url(#ah-accent)"/>
<text x="260.0" y="150.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">push: one CAS</text>
<text x="260.0" y="165.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">per buffer</text>
<rect x="520" y="120" width="180" height="84" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="610.0" y="152.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919" font-weight="600">GC marking threads</text>
<text x="610.0" y="170.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">mark what the logged</text>
<text x="610.0" y="185.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">pointers refer to</text>
<path d="M440,162 H516" fill="none" stroke="#257de0" stroke-width="1.5" marker-end="url(#ah-accent)"/>
<text x="478.0" y="152.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">pop</text>
<rect x="290" y="280" width="150" height="52" rx="6" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="365.0" y="302.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919" font-weight="600">buffer allocator</text>
<text x="365.0" y="319.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">(lock-free stack)</text>
<path d="M610,204 V306 H444" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
<text x="560.0" y="296.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">return for reuse</text>
<path d="M290,306 H170 V220" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
<text x="230.0" y="298.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">fresh buffer</text>
<path d="M210,72 C380,40 560,40 600,116" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-line)"/>
<text x="420.0" y="36.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#666666">partly filled buffers: collected at the pause that ends marking</text>
</svg>
