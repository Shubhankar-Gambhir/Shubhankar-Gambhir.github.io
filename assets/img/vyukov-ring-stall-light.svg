<text x="235.0" y="30" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" text-anchor="middle" fill="#191919" font-weight="600">_deq = 10</text>
<line x1="235.0" y1="38" x2="235.0" y2="64" stroke="#666666" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="571.0" y="30" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" text-anchor="middle" fill="#191919" font-weight="600">_enq = 14</text>
<line x1="571.0" y1="38" x2="571.0" y2="64" stroke="#666666" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="360.0" y="206" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919">pop() at ticket 10 reads seq 10, not 11, and returns EMPTY,</text>
<text x="360.0" y="224" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle" fill="#191919">so every consumer waits at cell 2 while cells 3 to 5 sit full.</text>
