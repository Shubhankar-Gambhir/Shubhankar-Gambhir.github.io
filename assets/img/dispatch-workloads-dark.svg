<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Nanoseconds per call on a log scale for four dispatch mechanisms across four workloads, monomorphic, round-robin, 90/10 and random, on GCC 11 and GCC 15. All four climb five to ten times from monomorphic to random. Function pointer and CRTP coincide everywhere. Virtual sits about 1 ns above function pointer at 90/10 and 3.4 ns above at random. Variant is the slowest on GCC 11 and the fastest on GCC 15 at every workload.">
