<text x="30.0" y="238.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" text-anchor="start" fill="#666666">call *16(%rax)</text>
<line x1="120.0" y1="248" x2="120.0" y2="267" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#ah-line)"/>
