<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Two call paths compiled by GCC 11.4. Virtual dispatch reloads the object pointer, loads the vptr, calls through vtable slot 2, and the callee receives its arguments in registers and runs 5 instructions. std::visit first stores two locals into a lambda capture struct on the stack, loads the variant index byte, calls through the library table, and the callee reads both captures back from the stack and runs 15 instructions.">
<rect width="720" height="400" fill="#ffffff"/>
<defs>
<marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
<marker id="ah-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f47230"/></marker>
</defs>
<text x="20.0" y="34.0" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="start" fill="#191919" font-weight="600">virtual dispatch</text>
<rect x="20" y="66" width="200" height="46" rx="5" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.2"/>
