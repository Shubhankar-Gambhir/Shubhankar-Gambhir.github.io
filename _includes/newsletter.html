<div class="newsletter-box mt-4 mb-4 p-4 rounded" style="background: var(--card-bg); border: 1px solid var(--btn-border-color);">

  <p class="text-muted mb-3" style="font-size: 0.9rem;">
    Assembly-deep C++ and JVM posts.
  </p>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/sgambhir"
    method="post"
    target="popupwindow"
